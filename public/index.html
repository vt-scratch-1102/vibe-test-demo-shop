<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · Vibe Test Demo Shop</title>
<link rel="stylesheet" href="/style.css">
<script src="/shop.js"></script>
</head>
<body>
<div class="demo-banner">Demo store for trying Vibe Test — nothing here is for sale and no payment is taken.</div>
<header>
  <a class="brand" href="/">Demo Shop</a>
  <nav><a href="/">Products</a> · <a href="/cart" id="cart-link">Cart (<span id="cart-count">0</span>)</a></nav>
</header>
<main>
<h1>Products</h1>
<form id="search" role="search"><label>Search products <input name="q" placeholder="e.g. lamp"></label></form>
<p id="no-results" hidden>No products match your search.</p>
<div class="grid" id="products"></div>
<script>
  function renderProducts(q = "") {
    const shown = PRODUCTS.filter((p) => p.name.includes(q.trim()));
    document.getElementById("no-results").hidden = shown.length > 0;
    document.getElementById("products").innerHTML = shown.map((p) => `
    <article class="card" data-product="${p.id}">
      <h2><a href="/product?id=${p.id}">${p.name}</a></h2>
      <p>${p.blurb}</p>
      <p class="price">${money(p.price)}</p>
      <button onclick="addToCart(${p.id})">Add to cart</button>
    </article>`).join("");
  }
  const search = document.getElementById("search");
  search.oninput = () => renderProducts(search.q.value);
  search.onsubmit = (e) => { e.preventDefault(); renderProducts(search.q.value); };
  renderProducts();
</script>
</main>
</body>
</html>
