<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · Vibe Test Demo Shop</title>
<link rel="stylesheet" href="/style.css">
<script src="/shop.js"></script>
</head>
<body>
<div class="demo-banner">Demo store for trying Vibe Test — nothing here is for sale and no payment is taken.</div>
<header>
  <a class="brand" href="/">Demo Shop</a>
  <nav><a href="/">Products</a> · <a href="/cart" id="cart-link">Cart (<span id="cart-count">0</span>)</a></nav>
</header>
<main>
<h1>Products</h1>
<div class="grid" id="products"></div>
<script>
  document.getElementById("products").innerHTML = PRODUCTS.map((p) => `
    <article class="card" data-product="${p.id}">
      <h2><a href="/product?id=${p.id}">${p.name}</a></h2>
      <p>${p.blurb}</p>
      <p class="price">${money(p.price)}</p>
      <button onclick="addToCart(${p.id})">Add to cart</button>
    </article>`).join("");
</script>
</main>
</body>
</html>
